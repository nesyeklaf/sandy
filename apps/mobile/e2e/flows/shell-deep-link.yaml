# Deep links reach the page. A `sandy://` scheme link and a web link for a saved
# server both resolve to one shell route carrying a page path; the page's own
# router takes it from there. The screens the shell keeps stay native.
#
# Runs after shell-launch, which leaves the E2E backend paired.
appId: app.sandy.mobile
env:
  METRO_URL: "http://127.0.0.1:8082"
  SERVER_URL: "http://127.0.0.1:41999"
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/pair-direct-server.yaml

# A scheme link into a page surface.
- runFlow:
    file: ../subflows/open-sandy-link.yaml
    env:
      LINK: "sandy://threads"
- extendedWaitUntil:
    visible:
      id: "shell-webview"
    timeout: 30000

# A scheme link carrying a page path lands on that page.
- runFlow:
    file: ../subflows/open-sandy-link.yaml
    env:
      LINK: "sandy://"
- extendedWaitUntil:
    visible:
      id: "shell-webview"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*Ask anything.*"
    timeout: 60000
- takeScreenshot: shell-deep-link-page
# There is deliberately no web-link step here. The app claims no universal
# link domain, so iOS hands `http://127.0.0.1:.../` to Safari — correctly.
# The web-link branch of the resolver is covered by unit tests in
# src/lib/shell/shell-links.test.ts.
