name: sandy-observability

services:
  lgtm:
    image: grafana/otel-lgtm:0.38.1
    restart: unless-stopped
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${SANDY_LGTM_GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: Tailscale-User-Login
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:${SANDY_LGTM_GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${SANDY_LGTM_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${SANDY_LGTM_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - lgtm-data:/data
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/sandy.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/sandy-dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  lgtm-data:
