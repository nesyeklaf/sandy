name: Fork Build Windows

# Builds the unsigned Windows x64 installer of this fork on a GitHub-hosted
# runner. Native modules must be packaged on a Windows host, so this cannot
# run from scripts/fork/release.sh on Linux.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or commit to build"
        required: true
        default: main

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Package x64 installer
        run: pnpm exec turbo run desktop:build:win --filter=@sandy/desktop --output-logs=new-only

      - name: Smoke test packaged desktop app
        run: pnpm exec turbo run smoke:packaged --filter=@sandy/desktop --force --output-logs=new-only

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandy-desktop-windows-x64
          path: apps/desktop/release/*.exe
          if-no-files-found: error
