name: Cache workspace
description: Restore optional Turbo outputs and save them after successful jobs.
inputs:
  cache-prefix:
    required: true
    description: Job-specific Turbo cache prefix
  turbo-cache:
    default: "true"
    description: Whether to cache Turbo outputs
  turbo-cache-max-size-mb:
    default: "1024"
    description: Maximum saved Turbo cache size in MB
runs:
  using: composite
  steps:
    - name: Resolve Node version
      id: node
      if: inputs.turbo-cache == 'true'
      shell: bash
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"
    - name: Cache Turbo task outputs
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-node-${{ steps.node.outputs.version }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.cache-prefix }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-node-${{ steps.node.outputs.version }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.cache-prefix }}-
          ${{ runner.os }}-node-${{ steps.node.outputs.version }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
          ${{ runner.os }}-node-${{ steps.node.outputs.version }}-turbo-
    - name: Prune restored Turbo cache
      if: inputs.turbo-cache == 'true'
      shell: bash
      run: node scripts/prune-turbo-cache.mjs --dir .turbo/cache --max-size-mb "${{ inputs.turbo-cache-max-size-mb }}"
